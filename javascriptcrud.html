<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .userList {
            position: relative;   
                

        }        

        .listStyle {
            background-color: yellow;
            margin: 10px;
            padding: 20px;
            border-radius: 10px;
            list-style: none;            
        }

        .deleteList {
            position: absolute;
            left: 650px;
            background-color: red;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
           
        }

        .editList {
            position: absolute;
            left: 600px;
            background-color: rgb(11, 44, 229);
            border: none;
            padding: 5px 10px;
            border-radius: 6px;            
        }

        .editListNew {
            position: relative;
            left: 250px;
            background-color: rgb(11, 44, 229);
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
        }
    </style>
</head>

<body>



    <input type="text" id="userInput" placeholder="Enter task">
    <button onclick="addUser()">Add</button>

    <ul id="userList">

    </ul>


    <script>
        function addUser() {
            const userValue = document.getElementById('userInput').value;
            const li = document.createElement('li')
            li.textContent = userValue;
            console.log(li);
            const list = document.getElementById('userList');
            list.appendChild(li)
            li.classList.add('listStyle')
            const editBtn = document.createElement('button');
            document.getElementById('userInput').value = ""
            editBtn.textContent = 'Edit'
            editBtn.classList.add('editList')
            li.appendChild(editBtn)
            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = 'Delete'
            deleteBtn.classList.add('deleteList')
            li.appendChild(deleteBtn)

            deleteBtn.addEventListener('click', () => {
                li.remove();
            })

            editBtn.addEventListener('click', () => {

                if (editBtn.textContent === 'Edit') {
                    editBtn.textContent = 'Save';
                    const taskText = li.firstChild.textContent;                    
                    li.innerHTML = '';
                    const input = document.createElement('input');
                    editBtn.classList.add('editListNew')
                    // deleteBtn.classList.add('deleteList')
                    input.type = 'text';
                    input.value = taskText;
                    li.appendChild(input);
                    li.appendChild(editBtn);
                    li.appendChild(deleteBtn);

                }

                else {
                    const input = li.querySelector('input');
                    const newText = input.value;
                    li.innerHTML = newText; // set new text
                    editBtn.textContent = 'Edit';
                    editBtn.classList.remove('editListNew')
                    li.appendChild(editBtn);
                    li.appendChild(deleteBtn);
                }
            });

        }


    </script>
</body>

</html>
